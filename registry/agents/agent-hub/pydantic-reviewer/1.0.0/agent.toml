schema_version = 1
owner = "agent-hub"
name = "pydantic-reviewer"
version = "1.0.0"
description = "A Pydantic AI AgentSpec that reviews changes without modifying the workspace."
keywords = ["pydantic-ai", "agent-spec", "review", "read-only"]
runtime = "pydantic-ai"
model = "anthropic:claude-sonnet-4-6"
