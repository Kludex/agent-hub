<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1080" viewBox="0 0 1280 1080" role="img" aria-labelledby="title description">
  <title id="title">Agent Hub architecture</title>
  <desc id="description">Pi, Claude Code, and Codex connect through local interfaces to the persistent Agent Hub service. The service schedules Pi, Pydantic AI, and CodePuppy runtimes in shared or isolated workspaces.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 30px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .section { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; letter-spacing: 0.4px; }
      .label { font: 600 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .small { font: 500 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .edge { fill: none; stroke: #334155; stroke-width: 2.2; marker-end: url(#arrow); }
      .line { fill: none; stroke: #334155; stroke-width: 2.2; }
      .edge-both { fill: none; stroke: #334155; stroke-width: 2.2; marker-start: url(#arrow); marker-end: url(#arrow); }
      .panel { stroke-width: 2; rx: 18; }
      .box { fill: #ffffff; stroke: #475569; stroke-width: 2; rx: 12; filter: url(#shadow); }
    </style>
  </defs>

  <rect width="1280" height="1080" fill="#f8fafc"/>
  <text x="50" y="50" class="title">Agent Hub architecture</text>

  <rect x="50" y="80" width="1180" height="150" class="panel" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="75" y="112" class="section">1. Clients</text>
  <rect x="90" y="135" width="280" height="65" class="box"/>
  <text x="230" y="162" text-anchor="middle" class="label">Pi session</text>
  <text x="230" y="184" text-anchor="middle" class="small">task tool and /hub</text>
  <rect x="500" y="135" width="280" height="65" class="box"/>
  <text x="640" y="175" text-anchor="middle" class="label">Claude Code</text>
  <rect x="910" y="135" width="280" height="65" class="box"/>
  <text x="1050" y="175" text-anchor="middle" class="label">Codex</text>

  <rect x="50" y="260" width="1180" height="160" class="panel" fill="#ede9fe" stroke="#a78bfa"/>
  <text x="75" y="292" class="section">2. Local interfaces</text>
  <rect x="90" y="320" width="280" height="65" class="box"/>
  <text x="230" y="347" text-anchor="middle" class="label">Bundled Pi extension</text>
  <text x="230" y="369" text-anchor="middle" class="small">JSON-RPC and event stream</text>
  <rect x="705" y="320" width="350" height="65" class="box"/>
  <text x="880" y="347" text-anchor="middle" class="label">agent-hub mcp</text>
  <text x="880" y="369" text-anchor="middle" class="small">stdio bridge to JSON-RPC</text>

  <path d="M230 200 L230 320" class="edge"/>
  <path d="M640 200 L640 235 L820 235 L820 320" class="edge"/>
  <path d="M1050 200 L1050 235 L940 235 L940 320" class="edge"/>
  <text x="700" y="225" class="small">MCP over stdio</text>
  <text x="957" y="225" class="small">MCP over stdio</text>

  <rect x="50" y="450" width="1180" height="300" class="panel" fill="#cffafe" stroke="#22d3ee"/>
  <text x="75" y="482" class="section">3. Persistent Agent Hub user service</text>
  <rect x="100" y="525" width="230" height="80" class="box"/>
  <text x="215" y="557" text-anchor="middle" class="label">JSON-RPC API</text>
  <text x="215" y="581" text-anchor="middle" class="small">commands and events</text>
  <rect x="410" y="525" width="230" height="80" class="box"/>
  <text x="525" y="557" text-anchor="middle" class="label">Runtime-neutral manager</text>
  <text x="525" y="581" text-anchor="middle" class="small">lifecycle and hierarchy</text>
  <rect x="720" y="525" width="230" height="80" class="box"/>
  <text x="835" y="557" text-anchor="middle" class="label">Concurrency scheduler</text>
  <text x="835" y="581" text-anchor="middle" class="small">limits and workspace locks</text>
  <rect x="410" y="650" width="230" height="65" class="box"/>
  <text x="525" y="690" text-anchor="middle" class="label">Agent profiles</text>
  <rect x="720" y="650" width="230" height="65" class="box"/>
  <text x="835" y="677" text-anchor="middle" class="label">Replayable event journal</text>
  <text x="835" y="699" text-anchor="middle" class="small">ordered lifecycle history</text>
  <rect x="1020" y="650" width="150" height="65" class="box"/>
  <text x="1095" y="690" text-anchor="middle" class="label">SQLite</text>

  <path d="M230 385 L230 450 L215 450 L215 525" class="edge"/>
  <path d="M880 385 L880 435 L215 435 L215 525" class="edge"/>
  <text x="300" y="428" class="small">private Unix socket</text>
  <path d="M330 565 L410 565" class="edge"/>
  <path d="M640 565 L720 565" class="edge"/>
  <path d="M525 650 L525 605" class="edge"/>
  <path d="M640 585 L680 585 L680 682 L720 682" class="edge"/>
  <path d="M950 682 L1020 682" class="edge-both"/>

  <rect x="50" y="780" width="1180" height="180" class="panel" fill="#ffedd5" stroke="#fb923c"/>
  <text x="75" y="812" class="section">4. Runtime adapters and workers</text>
  <rect x="90" y="835" width="320" height="90" class="box"/>
  <text x="250" y="865" text-anchor="middle" class="label">Pi adapter</text>
  <text x="250" y="890" text-anchor="middle" class="small">Pi RPC subprocess</text>
  <rect x="480" y="835" width="320" height="90" class="box"/>
  <text x="640" y="865" text-anchor="middle" class="label">Pydantic AI adapter</text>
  <text x="640" y="890" text-anchor="middle" class="small">in-process Pydantic AI agent</text>
  <rect x="870" y="835" width="320" height="90" class="box"/>
  <text x="1030" y="865" text-anchor="middle" class="label">CodePuppy ACP adapter</text>
  <text x="1030" y="890" text-anchor="middle" class="small">CodePuppy ACP subprocess</text>

  <path d="M950 565 L980 565 L980 770 L250 770 L250 835" class="edge"/>
  <path d="M950 565 L980 565 L980 770 L640 770 L640 835" class="edge"/>
  <path d="M950 565 L980 565 L980 770 L1030 770 L1030 835" class="edge"/>

  <path d="M250 925 L250 950 L430 950" class="line"/>
  <path d="M640 925 L640 950 L430 950" class="line"/>
  <path d="M1030 925 L1030 950 L430 950" class="line"/>
  <path d="M430 950 L430 990" class="edge"/>
  <text x="560" y="944" class="small">Every runtime uses the workspace selected for its run</text>

  <rect x="50" y="970" width="1180" height="90" class="panel" fill="#dcfce7" stroke="#4ade80"/>
  <text x="75" y="1002" class="section">5. Assigned workspace</text>
  <rect x="300" y="990" width="260" height="50" class="box"/>
  <text x="430" y="1021" text-anchor="middle" class="label">Per-run assignment</text>
  <rect x="675" y="990" width="240" height="50" class="box"/>
  <text x="795" y="1021" text-anchor="middle" class="label">Shared project</text>
  <rect x="955" y="990" width="230" height="50" class="box"/>
  <text x="1070" y="1021" text-anchor="middle" class="label">Detached worktree</text>

  <path d="M560 1015 L675 1015" class="edge"/>
  <path d="M560 1015 L620 1015 L620 1050 L930 1050 L930 1015 L955 1015" class="edge"/>
</svg>
