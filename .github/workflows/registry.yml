name: Registry

on:
  pull_request:
    paths:
      - "registry/**"
      - "src/agent_hub/catalog_models.py"
      - "src/agent_hub/registry_index.py"
  push:
    branches: [main]
    paths:
      - "registry/**"
      - "src/agent_hub/catalog_models.py"
      - "src/agent_hub/registry_index.py"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv run python -m agent_hub.registry_index registry --check
      - run: uv run python -m agent_hub.registry_validation registry
      - if: github.event_name == 'pull_request'
        run: uv run python -m agent_hub.registry_validation registry --repository . --base-ref origin/${{ github.base_ref }}
      - run: uv run pytest
